# Vercel Hobby'de cron yok — haftalık YZ nabız özeti (F4) buradan tetiklenir.
name: NMM pulse weekly AI

on:
  schedule:
    - cron: '0 7 * * 1' # Pazartesi ~10:00 TR (UTC+3 yaz saati yaklaşık)
  workflow_dispatch:

jobs:
  pulse-weekly:
    runs-on: ubuntu-latest
    steps:
      - name: Haftalık nabız AI özeti (rollup + Gemini)
        run: |
          curl -fsS --max-redirs 0 -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NMM_APP_URL }}/api/cron/pulse-weekly"
