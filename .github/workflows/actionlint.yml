name: actionlint

# Workflow YAML + GitHub ifadelerini (secrets./needs./matrix./inputs.) doğrular —
# yanlış secret referansı, geçersiz `needs`, bozuk ifade gibi hatalar PUSH'tan/
# MERGE'den önce yakalanır. Yalnız .github/workflows/** değişince koşar.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint (YAML + ifade)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: actionlint
        run: |
          VERSION=1.7.0
          curl -sfL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp actionlint
          # shellcheck entegrasyonu kapalı: mevcut run-bloklarının bash stil temizliği
          # ayrı bir tura bırakıldı (yanlış-pozitif CI'ı kırmasın). Çekirdek değer —
          # YAML yapısı + GitHub ifade/secret/needs doğrulaması — aktif.
          /tmp/actionlint -color -shellcheck=
