name: actionlint

# Workflow YAML + GitHub ifadelerini (secrets./needs./matrix./inputs.) doğrular —
# yanlış secret referansı, geçersiz `needs`, bozuk ifade gibi hatalar PUSH'tan/
# MERGE'den önce yakalanır. Yalnız .github/workflows/** değişince koşar.

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint (YAML + ifade + bash)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: actionlint
        run: |
          VERSION=1.7.0
          curl -sfL "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /tmp actionlint
          # actionlint PATH'teki shellcheck'i otomatik kullanır (ubuntu-latest preinstalled)
          # → YAML/ifade + run-bloklarının bash'i birlikte lint edilir.
          /tmp/actionlint -color
