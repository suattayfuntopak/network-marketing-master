name: Deploy (production)

# Vercel'in Git auto-deploy'u CI'dan BAĞIMSIZ çalışır; kırık bir commit bile
# anında prod'a gidebilir. Bu workflow, "CI Gate" (lint + unit + build, ~2 dk)
# YEŞİL olduğunda Vercel Deploy Hook'unu tetikleyerek prod deploy'u CI'a bağlar.
# Playwright E2E (e2e.yml) ADVISORY'dir — ayrı koşar, sonucu görünür ama deploy'u
# BLOKLAMAZ. Böylece deploy hızlı kalır (commit→push→~2 dk prod) ama lint/unit/
# build geçmeyen commit prod'a gitmez. (Vercel build de kırık derlemeyi promote etmez.)
#
# AKTİVASYON — yalnızca repo sahibi yapabilir (2 adım):
#   1) Vercel → Project → Settings → Git → Deploy Hooks → branch "main" için bir
#      hook oluştur; URL'i GitHub'a `VERCEL_DEPLOY_HOOK_URL` secret'ı olarak ekle.
#   2) `vercel.json` içine şunu ekle (Git push auto-deploy'u kapatır, gate devreye girer):
#        "git": { "deploymentEnabled": { "main": false } }
#      Deploy Hook bu ayardan etkilenmez — yalnızca bu workflow deploy tetikler.
#
# Secret YOKKEN bu workflow no-op'tur: hiçbir şeyi bozmaz, Vercel auto-deploy
# bugünkü gibi çalışmaya devam eder. Aktivasyon dökümanı:
# docs/deploy/github-secrets.md → "CI-driven deploy (opsiyonel gate)".

on:
  workflow_run:
    workflows: ['CI Gate']
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  deploy:
    name: Trigger Vercel prod deploy
    # Yalnızca main'e push'tan gelen ve BAŞARILI biten CI Gate koşusunda deploy et.
    # CI Gate conclusion=success ⇒ lint + unit + build geçti (Playwright advisory,
    # ayrı workflow). Ek bir job doğrulamasına gerek yok.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      # Migration sıralama kapısı: bu commit migration DEĞİŞTİRDİYSE, uygulamayı
      # deploy etmeden ÖNCE "Migration check" (→ migrate-deploy, prod'a uygular)
      # koşusunun bu SHA için BAŞARILI bittiğini doğrula. Böylece yeni kod, henüz
      # uygulanmamış şemaya çarpmaz. Salt-okunur; hata/zaman aşımında FAIL-OPEN
      # (additive/expand-contract politikası güvenliği) — yalnız Migration check
      # AÇIKÇA başarısızsa deploy'u engeller.
      - name: Migration sıralama kapısı
        env:
          GATE_TIMEOUT_MIN: ${{ vars.MIGRATION_GATE_TIMEOUT_MIN || 4 }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const sha = context.payload.workflow_run.head_sha
            let touched = false
            try {
              const cmp = await github.rest.repos.getCommit({ owner, repo, ref: sha })
              touched = (cmp.data.files || []).some(
                f => f.filename.startsWith('supabase/migrations/') && f.filename.endsWith('.sql')
              )
            } catch (e) {
              core.warning(`Commit dosyaları okunamadı (${e.message}) — gate fail-open, deploy devam.`)
              return
            }
            if (!touched) { core.info('Migration .sql değişmedi — gate atlandı.'); return }
            const timeoutMin = Number(process.env.GATE_TIMEOUT_MIN) || 4
            const started = Date.now()
            core.info(`Migration değişti — "Migration check" başarısı bekleniyor (max ~${timeoutMin} dk)...`)
            const deadline = started + timeoutMin * 60 * 1000
            while (Date.now() < deadline) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, head_sha: sha, per_page: 30,
              })
              const mc = data.workflow_runs.find(r => r.name === 'Migration check')
              if (mc && mc.status === 'completed') {
                if (mc.conclusion === 'success') {
                  core.info(`Migration check başarılı (${Math.round((Date.now() - started) / 1000)}s) — migration uygulandı, deploy devam.`)
                  return
                }
                core.setFailed(`Migration check conclusion=${mc.conclusion} — migration prod'a uygulanmadı, deploy ENGELLENDİ. Düzelt ve yeniden deploy et.`)
                return
              }
              await new Promise(r => setTimeout(r, 15000))
            }
            core.warning('Migration check zamanında bitmedi — gate fail-open (expand/contract güvenliği). Durumu Actions\'tan doğrula.')

      - name: Deploy hook (CI Gate yeşilse)
        id: hook
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK_URL tanımlı değil — CI-driven deploy PASİF."
            echo "Vercel Git auto-deploy aktif kalmalı. Aktivasyon: docs/deploy/github-secrets.md"
            echo "hook_active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "hook_active=true" >> "$GITHUB_OUTPUT"
          echo "CI Gate yeşil → Vercel prod deploy tetikleniyor (commit ${SHA:0:7})"
          curl -fsS -X POST "$HOOK_URL" >/dev/null
          echo "Deploy hook tetiklendi."

      - name: Prod smoke (pano)
        id: smoke
        if: steps.hook.outputs.hook_active == 'true'
        env:
          PROD_URL: ${{ vars.NMM_PROD_URL || 'https://nmm.suattayfuntopak.com' }}
        run: |
          echo "Prod smoke: $PROD_URL/pano (deploy tamamlanana kadar bekleniyor)"
          ok=0
          for i in $(seq 1 12); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$PROD_URL/pano" || echo "000")
            if [ "$code" = "200" ] || [ "$code" = "307" ] || [ "$code" = "308" ]; then
              echo "Prod healthy (HTTP $code) — attempt $i"
              ok=1
              break
            fi
            echo "Attempt $i: HTTP $code — 30s bekleniyor..."
            sleep 30
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::Prod smoke failed after deploy hook — $PROD_URL/pano yanıt vermedi."
            exit 1
          fi

      # Başarılı deploy + smoke → opsiyonel Telegram "deploy edildi" bildirimi.
      - name: Telegram deploy bildirimi (opsiyonel)
        if: success() && steps.hook.outputs.hook_active == 'true'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "TELEGRAM_BOT_TOKEN/CHAT_ID yok — Telegram bildirimi atlandı."; exit 0
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=✅ NMM: Prod deploy edildi ve /pano sağlıklı (${SHA:0:7})." \
            >/dev/null || echo "Telegram gönderimi başarısız (tolere edildi)."

  smoke-alert:
    name: Prod smoke failure alert
    needs: deploy
    if: failure() && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const sha = context.payload.workflow_run.head_sha.slice(0, 7)
            const runUrl = context.payload.workflow_run.html_url
            const prodUrl = process.env.NMM_PROD_URL || 'https://nmm.suattayfuntopak.com'
            const title = `[prod-smoke] Deploy health check failed (${sha})`

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'prod-smoke',
              per_page: 5,
            })
            if (openIssues.length > 0) {
              core.info(`Açık prod-smoke issue zaten var: #${openIssues[0].number}`)
              return
            }

            await github.rest.issues.create({
              owner,
              repo,
              title,
              labels: ['prod-smoke'],
              body: [
                'Prod deploy hook tetiklendi ancak `/pano` smoke testi başarısız.',
                '',
                `- Commit: \`${sha}\``,
                `- URL: ${prodUrl}/pano`,
                `- Workflow: ${runUrl}`,
                '',
                'Olası nedenler: Vercel build sürmekte, deploy hata verdi veya uygulama 5xx dönüyor.',
              ].join('\n'),
            })
            core.info('prod-smoke issue oluşturuldu.')
        env:
          NMM_PROD_URL: ${{ vars.NMM_PROD_URL }}

      # Opsiyonel Telegram bildirimi — secret tanımlıysa mobile anında haber; yoksa no-op.
      - name: Telegram bildirimi (opsiyonel)
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "TELEGRAM_BOT_TOKEN/CHAT_ID yok — Telegram bildirimi atlandı."; exit 0
          fi
          curl -fsS -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=🟠 NMM: Prod deploy smoke testi BAŞARISIZ (${SHA:0:7}). /pano yanıt vermedi. ${RUN_URL}" \
            >/dev/null || echo "Telegram gönderimi başarısız (tolere edildi)."
