name: E2E (Playwright)

# ADVISORY — deploy'u bloklamaz (CI Gate ayrı).
# Maliyet: PR'da KOŞMAZ (en pahalı job). Tetikleyiciler:
#   • main push (uygulama kodu değiştiyse)
#   • haftalık schedule (Pazartesi 06:00 İstanbul)
#   • workflow_dispatch (elle)
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'e2e/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'playwright.config.ts'
      - 'tailwind.config.ts'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
  schedule:
    # Pazartesi 06:00 Europe/Istanbul (UTC+3) ≈ 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: '1'
  NODE_OPTIONS: '--max-old-space-size=6144'

# lint → build → playwright (desktop + mobile paralel, ayrı artifact).
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
      GEMINI_API_KEY: placeholder-gemini
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

  playwright-chromium:
    name: E2E (chromium)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' && secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != '' && secrets.GEMINI_API_KEY || 'placeholder-gemini' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      - name: Check E2E credentials
        id: e2e_creds
        run: |
          if [ -z "${{ secrets.PLAYWRIGHT_TEST_EMAIL }}" ] || [ -z "${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::PLAYWRIGHT_TEST_EMAIL/PASSWORD tanımlı değil — E2E atlanıyor."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build application (for next start)
        if: steps.e2e_creds.outputs.skip != 'true'
        run: npm run build

      - name: Run Playwright (chromium)
        if: steps.e2e_creds.outputs.skip != 'true'
        run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          PLAYWRIGHT_TRIAL_EXPIRED_EMAIL: ${{ secrets.PLAYWRIGHT_TRIAL_EXPIRED_EMAIL }}
          PLAYWRIGHT_TRIAL_EXPIRED_PASSWORD: ${{ secrets.PLAYWRIGHT_TRIAL_EXPIRED_PASSWORD }}
          PLAYWRIGHT_INVITE_REF: ${{ secrets.PLAYWRIGHT_INVITE_REF }}
          PLAYWRIGHT_INVITE_ADAY: ${{ secrets.PLAYWRIGHT_INVITE_ADAY }}

      - name: E2E skipped (no credentials)
        if: steps.e2e_creds.outputs.skip == 'true'
        run: echo "E2E skipped — add PLAYWRIGHT_TEST_EMAIL and PLAYWRIGHT_TEST_PASSWORD secrets to enable."

      - name: Upload Playwright report (chromium)
        uses: actions/upload-artifact@v7
        if: steps.e2e_creds.outputs.skip != 'true' && !cancelled()
        with:
          name: playwright-report-chromium
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  playwright-mobile:
    name: E2E (mobile-chrome)
    needs: build
    # Haftalık cron'da yalnızca chromium (maliyet); mobile push/dispatch'ta.
    if: github.event_name != 'schedule'
    # Advisory: mobile flake prod deploy'u bloklamaz (deploy.yml chromium doğrular).
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL != '' && secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY != '' && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' && secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-key' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY != '' && secrets.GEMINI_API_KEY || 'placeholder-gemini' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium — mobile-chrome aynı motor)
        run: npx playwright install --with-deps chromium

      - name: Check E2E credentials
        id: e2e_creds
        run: |
          if [ -z "${{ secrets.PLAYWRIGHT_TEST_EMAIL }}" ] || [ -z "${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build application (for next start)
        if: steps.e2e_creds.outputs.skip != 'true'
        run: npm run build

      - name: Run Playwright (mobile-chrome)
        if: steps.e2e_creds.outputs.skip != 'true'
        run: npx playwright test --project=mobile-chrome
        env:
          PLAYWRIGHT_TEST_EMAIL: ${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
          PLAYWRIGHT_TEST_PASSWORD: ${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
          PLAYWRIGHT_TRIAL_EXPIRED_EMAIL: ${{ secrets.PLAYWRIGHT_TRIAL_EXPIRED_EMAIL }}
          PLAYWRIGHT_TRIAL_EXPIRED_PASSWORD: ${{ secrets.PLAYWRIGHT_TRIAL_EXPIRED_PASSWORD }}
          PLAYWRIGHT_INVITE_REF: ${{ secrets.PLAYWRIGHT_INVITE_REF }}
          PLAYWRIGHT_INVITE_ADAY: ${{ secrets.PLAYWRIGHT_INVITE_ADAY }}

      - name: Mobile E2E advisory notice
        if: failure()
        run: |
          echo "::warning::Mobile E2E başarısız (advisory) — prod gate yalnızca E2E (chromium) gerektirir."

      - name: Upload Playwright report (mobile)
        uses: actions/upload-artifact@v7
        if: steps.e2e_creds.outputs.skip != 'true' && !cancelled()
        with:
          name: playwright-report-mobile
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  e2e-summary:
    name: E2E özeti
    needs: [lint, build, playwright-chromium, playwright-mobile]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Haftalık E2E sonuç özeti
        run: |
          {
            echo "## E2E haftalık özeti"
            echo ""
            echo "| Job | Sonuç |"
            echo "|-----|-------|"
            echo "| Lint | ${{ needs.lint.result }} |"
            echo "| Build | ${{ needs.build.result }} |"
            echo "| Chromium | ${{ needs.playwright-chromium.result }} |"
            echo "| Mobile (advisory) | ${{ needs.playwright-mobile.result }} |"
            echo ""
            echo "Tetikleyici: \`${{ github.event_name }}\` — billing kotası için Actions kullanımını izleyin."
          } >> "$GITHUB_STEP_SUMMARY"
