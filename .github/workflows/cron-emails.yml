# Vercel Hobby'de cron yok — günlük trial/lisans e-postaları buradan tetiklenir.
name: NMM scheduled emails

on:
  schedule:
    - cron: '0 6 * * *' # 09:00 TR (UTC+3 yaz saati yaklaşık)
  workflow_dispatch:

jobs:
  trial-and-license-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Trial lifecycle emails
        run: |
          curl -fsS --max-redirs 0 -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NMM_APP_URL }}/api/cron/trial-emails"

      - name: Paid license renewal reminders
        run: |
          curl -fsS --max-redirs 0 -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NMM_APP_URL }}/api/cron/license-reminder"

      - name: Daily calendar follow-up reminders
        run: |
          curl -fsS --max-redirs 0 -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NMM_APP_URL }}/api/cron/calendar-reminder"

      - name: Overdue follow-up reminders
        run: |
          curl -fsS --max-redirs 0 -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NMM_APP_URL }}/api/cron/overdue-reminders"

      - name: Hub prefetch daily rollup
        run: |
          curl -fsS --max-redirs 0 -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.NMM_APP_URL }}/api/cron/hub-prefetch-rollup"
