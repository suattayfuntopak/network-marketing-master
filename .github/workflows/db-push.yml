name: DB migrate (prod) — MANUEL yedek/onarım

# ⚙️ NORMAL AKIŞ OTOMATİKTİR — bu workflow'u elle çalıştırmaya GEREK YOKTUR.
# main'e push'ta `migrate-check.yml` → `migrate-deploy` job'ı, doğrulama (numara +
# gerçek-Postgres apply) YEŞİLSE bekleyen migration'ları prod'a kendisi uygular.
# Kötü migration o gate'e takılır, prod'a sızmaz.
#
# Bu workflow yalnızca İSTİSNAİ durumlar için elle tetiklenir:
#   - repair-gaps / repair : defter (migration ledger) boşluğu/uyumsuzluğu onarımı,
#   - apply                : otomatik job geçici devre dışıyken acil elle uygulama,
#   - dry-run              : prod'da neyin beklediğini görmek (salt-okunur).
#
# Gerekli secret'lar: SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
# (bkz. docs/deploy/github-secrets.md).
#
# Defter boşluğu (ör. 100 eksik, 101–103 uygulanmış): önce repair-gaps, sonra dry-run.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run / apply / repair-gaps (defter) / repair (tümü applied işaretle)'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - apply
          - repair-gaps
          - repair
      confirm:
        description: 'apply, repair ve repair-gaps için "PUSH" yazın (dry-run için boş)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  db-push:
    name: supabase db push (${{ inputs.mode }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: latest

      - name: Onay kontrolü (apply/repair/repair-gaps)
        if: (inputs.mode == 'apply' || inputs.mode == 'repair' || inputs.mode == 'repair-gaps') && inputs.confirm != 'PUSH'
        run: |
          echo "::error::${{ inputs.mode }} modu için confirm alanına 'PUSH' yazmalısınız. İptal edildi."
          exit 1

      - name: Secret kontrolü
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$REF" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF tanımlı değil. docs/deploy/github-secrets.md"
            exit 1
          fi

      - name: Link
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Migration durumu (list)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          echo "▶ Remote migration listesi:"
          supabase migration list --linked || true

      - name: Bekleyen migration'lar (dry-run)
        if: inputs.mode == 'dry-run'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/supabase-db-push.mjs dry-run

      - name: Migration'ları uygula (apply)
        if: inputs.mode == 'apply' && inputs.confirm == 'PUSH'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/supabase-db-push.mjs apply

      - name: Defter boşluklarını onar (repair-gaps)
        if: inputs.mode == 'repair-gaps' && inputs.confirm == 'PUSH'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/supabase-db-push.mjs repair-gaps

      # Defter onarımı: tüm yerel migration'ları "applied" işaretler — SQL ÇALIŞTIRMAZ.
      - name: Defteri onar — tümü (repair)
        if: inputs.mode == 'repair' && inputs.confirm == 'PUSH'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          versions=$(for f in supabase/migrations/[0-9]*.sql; do basename "$f"; done | grep -oE '^[0-9]+' | sort -u | tr '\n' ' ')
          echo "▶ 'applied' işaretlenecek versiyonlar: $versions"
          # shellcheck disable=SC2086  # $versions kasıtlı word-split: çoklu versiyon argümanı
          supabase migration repair --status applied $versions
          echo "✅ Defter güncellendi. Doğrulamak için mode=dry-run çalıştırın."
